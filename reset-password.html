<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>if(localStorage.getItem("jastip_theme")==="dark"||(!localStorage.getItem("jastip_theme")&&window.matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.classList.add("dark");</script>
    <title>Reset Password - Jastip Zhar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="login-page">
    <main class="login-card">
      <div class="brand brand-center">
        <div class="brand-mark">J</div>
        <div><b>Jastip<span>Zhar</span></b><small>Management System</small></div>
      </div>
      <h1>Buat Password Baru</h1>
      <p class="muted">Masukkan password baru untuk akun Jastip Zhar Anda.</p>
      <form id="resetPasswordForm" class="form-stack" hidden>
        <label>Password baru
          <input id="newPassword" type="password" minlength="6" required autocomplete="new-password" placeholder="Minimal 6 karakter" />
        </label>
        <label>Ulangi password baru
          <input id="confirmPassword" type="password" minlength="6" required autocomplete="new-password" placeholder="Ketik ulang password" />
        </label>
        <button id="resetSubmit" class="btn btn-primary btn-block" type="submit">Simpan Password Baru</button>
      </form>
      <p id="resetMessage" class="muted" role="status" aria-live="polite">Memeriksa tautan pemulihan...</p>
      <div class="demo-hint"><a href="index.html" style="color:#06b6d4;font-weight:600;">Kembali ke halaman login</a></div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/reset-password.js"></script>
  </body>
</html>
